# Builds the native apps in the cloud, so no Mac or Android Studio is needed locally.
#  - Android: signed release APK (same key every time, so updates install over the old app).
#  - iOS: unsigned .ipa. AltServer/AltStore signs it with your own Apple ID when installing.
# Both are attached to a GitHub Release named after the build number.
name: Native builds

# Releases are batched: pushing to main does NOT ship an update (other people use the app).
# When enough changes have piled up, run this workflow by hand with a one-line summary:
#   gh workflow run native.yml -f summary="New PR rules, edit exercises, brachioradialis"
on:
  workflow_dispatch:
    inputs:
      summary:
        description: One-line "What's new" shown in the in-app update banner
        required: true

permissions:
  contents: write

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - run: npx cap sync android
      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > release.p12
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.p12 --ks-key-alias workoutapp --ks-pass env:KS_PASS --key-pass env:KS_PASS --out WorkoutApp.apk aligned.apk
          "$BT/apksigner" verify --print-certs WorkoutApp.apk | head -3
          rm release.p12
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: WorkoutApp.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - run: npx cap sync ios
      - name: Build unsigned app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry WorkoutApp.ipa Payload
          ls -lh WorkoutApp.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: WorkoutApp.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          # Banner reads the first line; below it, every change since the last release.
          PREV=$(git tag --list 'build-*' --sort=-v:refname | head -1)
          {
            echo "What's new: $SUMMARY"
            echo
            git log --no-merges --format='- %s' ${PREV:+$PREV..HEAD}
            echo
            echo "Android: send WorkoutApp.apk. iPhone: update from the AltStore source, or sideload WorkoutApp.ipa with AltServer."
          } > notes.md
          gh release create "build-${{ github.run_number }}" WorkoutApp.apk WorkoutApp.ipa --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Build ${{ github.run_number }}" --notes-file notes.md
      # AltStore source: a tiny "app store" listing. Add the URL in AltStore once
      # (Browse -> Sources -> +) and new builds show up as updates in My Apps.
      - name: Build AltStore source
        env:
          SUMMARY: ${{ inputs.summary }}
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          SITE="https://${OWNER}.github.io/${REPO}"
          mkdir -p site
          cp assets/icon-only.png site/icon.png
          jq -n             --arg site "$SITE"             --arg version "1.0.${{ github.run_number }}"             --arg build "${{ github.run_number }}"             --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --arg notes "$SUMMARY"             --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/build-${{ github.run_number }}/WorkoutApp.ipa"             --argjson size "$(stat -c%s WorkoutApp.ipa)"             --arg repo "https://github.com/${GITHUB_REPOSITORY}"             '{
              name: "Workout App",
              identifier: "com.workoutapp.source",
              subtitle: "Private builds of Workout App",
              iconURL: ($site + "/icon.png"),
              website: $repo,
              tintColor: "#2F7BFF",
              apps: [{
                name: "Workout App",
                bundleIdentifier: "com.workoutapp.app",
                developerName: "Workout App",
                subtitle: "On-device workout tracker",
                localizedDescription: "Log lifts, track PRs and stalls, see fatigue and volume on a muscle map. All data stays on your phone.",
                iconURL: ($site + "/icon.png"),
                tintColor: "#2F7BFF",
                category: "lifestyle",
                versions: [{
                  version: $version,
                  buildVersion: $build,
                  date: $date,
                  localizedDescription: $notes,
                  downloadURL: $url,
                  size: $size,
                  minOSVersion: "15.0"
                }],
                appPermissions: { entitlements: [], privacy: {} }
              }],
              news: []
            }' > site/source.json
          cat site/source.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
